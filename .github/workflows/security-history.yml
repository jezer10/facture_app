name: Full secret history audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Scan every reachable ref with redacted output
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks-history.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-history"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "${archive}"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          "${install_dir}/gitleaks" git --redact --verbose --log-opts=--all .
