name: facture-local

services:
  mailpit:
    image: axllent/mailpit:v1.29.2
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_DISABLE_RDNS: 'true'
    volumes: [mailpit_data:/data]
    ports: ['127.0.0.1:58025:8025', '127.0.0.1:51025:1025']

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: [/usr/local/bin/start-secure-postgres.sh]
    command: [postgres]
    environment:
      POSTGRES_USER: billing_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/billing-postgres-secrets/postgres_admin_password
    secrets: [postgres_admin_password, core_db_password, sunat_db_password, webhook_db_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/001-create-billing-databases.sh:/docker-entrypoint-initdb.d/001-create-billing-databases.sh:ro
      - ./deploy/postgres/start-secure-postgres.sh:/usr/local/bin/start-secure-postgres.sh:ro
    ports: ['127.0.0.1:54330:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U billing_admin -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: [/usr/local/bin/start-secure-redis.sh]
    secrets:
      [redis_health_password, redis_worker_password, redis_sunat_password, redis_webhook_password]
    volumes:
      - redis_data:/data
      - ./deploy/redis/start-secure-redis.sh:/usr/local/bin/start-secure-redis.sh:ro
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test:
        [
          CMD-SHELL,
          'redis-cli --no-auth-warning --user billing_health -a "$$(cat /run/secrets/redis_health_password)" ping | grep -q PONG',
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_access_key
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_secret_key
    secrets: [minio_access_key, minio_secret_key]
    volumes: [minio_data:/data]
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  mailpit_data:
  postgres_data:
  redis_data:
  minio_data:

secrets:
  postgres_admin_password: { file: ./deploy/secrets/local/postgres_admin_password }
  core_db_password: { file: ./deploy/secrets/local/core_db_password }
  sunat_db_password: { file: ./deploy/secrets/local/sunat_db_password }
  webhook_db_password: { file: ./deploy/secrets/local/webhook_db_password }
  redis_health_password: { file: ./deploy/secrets/local/redis_health_password }
  redis_worker_password: { file: ./deploy/secrets/local/redis_worker_password }
  redis_sunat_password: { file: ./deploy/secrets/local/redis_sunat_password }
  redis_webhook_password: { file: ./deploy/secrets/local/redis_webhook_password }
  minio_access_key: { file: ./deploy/secrets/local/minio_access_key }
  minio_secret_key: { file: ./deploy/secrets/local/minio_secret_key }
